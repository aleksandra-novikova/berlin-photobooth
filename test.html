<style>
  /* Fonts are self-hosted: no request to Google, visitors' IPs stay private */
  @font-face { font-family: "Manrope"; font-weight: 400; font-display: swap; src: url("fonts/manrope-v23-latin-regular.woff2") format("woff2"); }
  @font-face { font-family: "Manrope"; font-weight: 500; font-display: swap; src: url("fonts/manrope-v23-latin-500.woff2") format("woff2"); }
  @font-face { font-family: "Open Sans"; font-weight: 800; font-display: swap; src: url("fonts/open-sans-v44-latin-800.woff2") format("woff2"); }
  :root { --s: 1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  body { font-family: "Manrope", sans-serif; letter-spacing: -0.05em; color: #000; }

  .title { left: 0; top: 200px; width: 1440px; margin: 0; text-align: center; font-size: 36px; font-weight: 400; line-height: 1; }
  .floor { position: fixed; z-index: 1; left: 0; right: 0; bottom: 0; height: calc(125px * var(--s)); background: #d9d9d9;
    display: flex; align-items: center; justify-content: center; padding: 0 16px; }
  .privacy { margin: 0; text-align: center; color: #555; font-size: max(12px, calc(18px * var(--s))); }

  /* 1440×1024 Figma frame, scaled to the viewport, anchored bottom-centre */
  .stage {
    position: fixed; left: 50%; bottom: 0; width: 1440px; height: 1024px;
    transform-origin: 50% 100%; transform: translateX(-50%) scale(var(--s));
    pointer-events: none;
  }
  .stage > * { pointer-events: auto; }
  .stage.base { z-index: 2; }
  .stage.top { z-index: 4; }
  .abs { position: absolute; }
  [hidden] { display: none !important; }

  .btn {
    position: absolute; display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 8px; background: #ffdddd; color: #000; cursor: pointer;
    font: 500 28px/1 "Manrope", sans-serif; letter-spacing: -0.05em;
    box-shadow: 0 4px 6px rgba(60, 10, 10, 0.3);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 3px rgba(60, 10, 10, 0.3); }
  .btn:focus-visible { outline: 3px solid #000; outline-offset: 3px; }
  .start { left: 514px; top: 759px; width: 151px; height: 44px; }
  .start .dot { width: 9px; height: 9px; border-radius: 50%; background: #d72a2a; }
  .start:hover .dot, .start:focus-visible .dot { background: #60c788; }
  .start:disabled { cursor: default; }

  /* Photoausgabe */
  .sign {
    left: 619px; top: 373px; width: 202px; height: 101px; background: #ffdddd;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .sign b { font-weight: 500; font-size: 24px; line-height: 1; }
  .sign span { font-weight: 500; font-size: 18px; line-height: 1; }
  .screw { width: 9px; height: 9px; border-radius: 50%; background: #9f9c97; top: 416px; }
  .slot { left: 641px; top: 498px; width: 158px; height: 294px; background: #692033; overflow: hidden; }
  .slot img { position: absolute; left: 32px; width: 93px; top: -480px; }
  .slot img.out { top: -186px; transition: top 5s cubic-bezier(.3,.1,.4,1); }

  .ready { left: 420px; top: 478px; width: 600px; text-align: center; color: #fff; font-size: 68px; font-weight: 500; line-height: 1; }
  .count {
    left: 626px; top: 455px; width: 200px; text-align: center;
    color: #fff; font-size: 90px; font-weight: 500; line-height: 1;
  }
  .msg { left: 470px; top: 480px; width: 500px; text-align: center; color: #fff; font-size: 28px; font-weight: 500; }
  .result-strip { left: 635px; top: 91px; width: 170px; }
  .dl { left: 867px; top: 470px; width: 148px; height: 46px; }
  .again { left: 867px; top: 540px; width: 148px; height: 46px; }

  .close {
    position: fixed; z-index: 4; top: max(16px, calc(30px * var(--s))); right: max(16px, calc(43px * var(--s)));
    width: max(44px, calc(46px * var(--s))); height: max(44px, calc(46px * var(--s)));
    display: flex; align-items: center; justify-content: center;
    border: 0; border-radius: 8px; background: #ffdddd; color: #000; cursor: pointer;
    box-shadow: 0 4px 6px rgba(60, 10, 10, 0.3);
  }
  .close svg { width: 45%; height: 45%; }
  .close:active { transform: translateY(2px); box-shadow: 0 2px 3px rgba(60, 10, 10, 0.3); }
  .close:focus-visible { outline: 3px solid #000; outline-offset: 3px; }

  .dim { position: fixed; inset: 0; z-index: 3; background: rgba(78, 78, 78, 0.9); }
  .flash { position: fixed; inset: 0; z-index: 5; background: #fff; opacity: 0; pointer-events: none; transition: opacity .5s ease-out; }
  .flash.on { opacity: .875; transition: none; }
  video { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
</style>

<script>
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));

// Scale the 1440×1024 frame: fit height, keep booth + buttons on narrow screens
function fit() {
  const s = Math.min(innerHeight / 1024, innerWidth / 640);
  document.documentElement.style.setProperty('--s', s);
}
addEventListener('resize', fit); fit();

// Strip geometry (from the Figma strip, at 2×)
const CELL_W = 656, CELL_H = 860, SIDE = 12, TOP = 16, GAP = 12;
const STRIP_W = CELL_W + SIDE * 2, STRIP_H = TOP * 2 + CELL_H * 4 + GAP * 3;

function retro(video) {
  const c = document.createElement('canvas'); c.width = CELL_W; c.height = CELL_H;
  const ctx = c.getContext('2d');
  const vw = video.videoWidth, vh = video.videoHeight, r = CELL_W / CELL_H;
  let sw = vw, sh = vw / r; if (sh > vh) { sh = vh; sw = vh * r; }
  ctx.save(); ctx.translate(CELL_W, 0); ctx.scale(-1, 1);           // mirror like a selfie
  ctx.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, CELL_W, CELL_H);
  ctx.restore();

  // Soft copy for skin smoothing: scale down and back up
  const sc = document.createElement('canvas'); sc.width = CELL_W / 4; sc.height = CELL_H / 4;
  const sctx = sc.getContext('2d'); sctx.imageSmoothingQuality = 'high';
  sctx.drawImage(c, 0, 0, sc.width, sc.height);
  const bc = document.createElement('canvas'); bc.width = CELL_W; bc.height = CELL_H;
  const bctx = bc.getContext('2d'); bctx.imageSmoothingQuality = 'high';
  bctx.drawImage(sc, 0, 0, CELL_W, CELL_H);
  const soft = bctx.getImageData(0, 0, CELL_W, CELL_H).data;

  // Flash-lit B&W: deep blacks, bright clean highlights, smooth skin, no grain
  const img = ctx.getImageData(0, 0, CELL_W, CELL_H), d = img.data;
  const lo = [6, 6, 7], hi = [247, 244, 238];
  const exposure = rand(-0.03, 0.03);                              // every frame is exposed a little differently
  const lum = (a, i) => (0.299 * a[i] + 0.587 * a[i + 1] + 0.114 * a[i + 2]) / 255;
  for (let i = 0; i < d.length; i += 4) {
    let L = lum(d, i);
    const B = lum(soft, i), diff = Math.abs(L - B);
    const w = diff < 0.12 ? 0.85 * (1 - diff / 0.12) : 0;          // smooth flat areas (skin), keep edges (eyes, hair)
    L += (B - L) * w;
    L = Math.pow(L, 0.85) + 0.05 + exposure;                       // flash: brighter mids and skin
    L = (L - 0.14) / 0.8;                                          // crush blacks, clip highlights
    L = L < 0 ? 0 : L > 1 ? 1 : L;
    L = L + 0.5 * (L * L * (3 - 2 * L) - L);                       // contrast
    d[i] = lo[0] + (hi[0] - lo[0]) * L; d[i + 1] = lo[1] + (hi[1] - lo[1]) * L; d[i + 2] = lo[2] + (hi[2] - lo[2]) * L;
  }
  ctx.putImageData(img, 0, 0);

  // Your textures: paper grain + dust & scratches, random crop per frame
  const tex = (el, mode, alpha) => {
    const s = Math.max(CELL_W / el.naturalWidth, CELL_H / el.naturalHeight) * (1.2 + Math.random() * 0.4);
    const w = el.naturalWidth * s, h = el.naturalHeight * s;
    ctx.globalCompositeOperation = mode; ctx.globalAlpha = alpha;
    ctx.drawImage(el, -Math.random() * (w - CELL_W), -Math.random() * (h - CELL_H), w, h);
  };
  tex($('texLight'), 'multiply', 0.12);   // only a hint of paper; no dust layer, so blacks stay deep
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  // Vignette
  const g = ctx.createRadialGradient(CELL_W / 2, CELL_H / 2, CELL_H * 0.3, CELL_W / 2, CELL_H / 2, CELL_H * 0.75);
  g.addColorStop(0, 'rgba(6,6,7,0)'); g.addColorStop(1, 'rgba(6,6,7,0.4)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CELL_W, CELL_H);

  // Chemistry flaws, different every time
  const a = rand(0, Math.PI * 2), r0 = CELL_H / 2;              // uneven development: one side a bit darker
  const ug = ctx.createLinearGradient(CELL_W / 2 - Math.cos(a) * r0, CELL_H / 2 - Math.sin(a) * r0, CELL_W / 2 + Math.cos(a) * r0, CELL_H / 2 + Math.sin(a) * r0);
  ug.addColorStop(0, 'rgba(20,14,10,0)'); ug.addColorStop(1, `rgba(20,14,10,${rand(0.04, 0.16)})`);
  ctx.fillStyle = ug; ctx.fillRect(0, 0, CELL_W, CELL_H);

  if (Math.random() < 0.35) {                                   // light leak from an edge
    const x = Math.random() < 0.5 ? rand(-60, 40) : rand(CELL_W - 40, CELL_W + 60), y = rand(0, CELL_H), rad = rand(220, 420);
    const lg = ctx.createRadialGradient(x, y, 0, x, y, rad);
    lg.addColorStop(0, `rgba(255,246,228,${rand(0.3, 0.5)})`); lg.addColorStop(1, 'rgba(255,246,228,0)');
    ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = lg; ctx.fillRect(0, 0, CELL_W, CELL_H);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (Math.random() < 0.25) {                                   // small chemical blotch
    const x = rand(40, CELL_W - 40), y = rand(40, CELL_H - 40), rad = rand(6, 18);
    const bg = ctx.createRadialGradient(x, y, 0, x, y, rad);
    bg.addColorStop(0, 'rgba(25,18,14,0.55)'); bg.addColorStop(1, 'rgba(25,18,14,0)');
    ctx.fillStyle = bg; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  if (Math.random() < 0.4) {                                    // a hair or fibre on the print
    const x = rand(0, CELL_W), y = rand(0, CELL_H);
    ctx.strokeStyle = 'rgba(245,238,225,0.5)'; ctx.lineWidth = rand(1, 2);
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + rand(-40, 40), y + rand(-40, 40), x + rand(-70, 70), y + rand(-70, 70));
    ctx.stroke();
  }
  return c;
}

function rand(min, max) { return min + Math.random() * (max - min); }

function buildStrip(frames) {
  const c = document.createElement('canvas'); c.width = STRIP_W; c.height = STRIP_H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, STRIP_W, STRIP_H);
  // Frames sit slightly crooked, like a real machine prints them
  frames.forEach((f, i) => {
    const cx = SIDE + CELL_W / 2 + rand(-4, 4), cy = TOP + i * (CELL_H + GAP) + CELL_H / 2 + rand(-3, 3);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rand(-0.006, 0.006));
    ctx.drawImage(f, -CELL_W / 2, -CELL_H / 2);
    ctx.restore();
  });
  // Slightly uneven cut along the edges
  const pts = [], j = () => rand(0, 4);
  for (let y = 0; y <= STRIP_H; y += STRIP_H / 8) pts.push([j(), y]);
  pts.push([STRIP_W - j(), STRIP_H]);
  for (let y = STRIP_H; y >= 0; y -= STRIP_H / 8) pts.push([STRIP_W - j(), y]);
  ctx.globalCompositeOperation = 'destination-in';
  ctx.beginPath(); pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill();
  stripBlob = null;
  c.toBlob(b => { stripBlob = b; }, 'image/png');   // ready before the strip is shown, so saving stays inside the tap
  return c.toDataURL('image/png');
}

// Sounds, synthesised with Web Audio (no audio files)
let ac = null;
function audioOn() {

let printBuf = null;
async function loadPrint() {
  if (printBuf || !ac) return;
  try { printBuf = await ac.decodeAudioData(await (await fetch(PRINT_SRC)).arrayBuffer()); } catch (e) {}
}
function printerSound() {
  if (!ac) return;
  const t = ac.currentTime;
  if (printBuf) { const src = ac.createBufferSource(); src.buffer = printBuf; src.connect(ac.destination); src.start(t); }
  paperDrop(t + 5.15);
}
// Paper strip landing on a hard tray: a short slap, then a small second tap
function paperDrop(t) {
  noiseBurst(t, 1400, 'bandpass', 0.8, 0.06);
  noiseBurst(t, 220, 'lowpass', 0.9, 0.07);
  noiseBurst(t + 0.09, 1600, 'bandpass', 0.25, 0.04);
}

let stripURL = null, stripBlob = null;

async function session() {
  $('start').disabled = true;
  $('msg').hidden = true;
  const video = $('video');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
  } catch (e) {
    $('dim').hidden = false;
    $('msg').textContent = 'Kein Kamerazugriff. Bitte erlaube die Kamera und versuch es noch einmal.';
    $('msg').hidden = false;
    await wait(3500);
    $('msg').hidden = true; $('dim').hidden = true; $('start').disabled = false;
    return;
  }
  video.srcObject = stream; await video.play();

  $('dim').hidden = false;
  // Warning screen before the first countdown
  $('ready').hidden = false;
  await wait(2000);
  $('ready').hidden = true;
  const frames = [];
  for (let shot = 0; shot < 4; shot++) {
    for (const n of [3, 2, 1]) { $('count').textContent = n; await wait(1000); }
    $('count').textContent = '';
    frames.push(retro(video));
    shutterSound();
    $('flash').classList.add('on');
    await wait(80);
    $('flash').classList.remove('on');
    await wait(900);
  }
  stream.getTracks().forEach(t => t.stop());
  stripURL = buildStrip(frames);

  // Photoausgabe: the strip slides out of the slot
  $('dim').hidden = true;
  $('sceneBooth').hidden = true;
  $('sceneOut').hidden = false;
  const slot = $('slotStrip');
  slot.classList.remove('out'); slot.src = stripURL;
  await wait(400);
  slot.classList.add('out');
  printerSound();
  await wait(5600);

  $('resultStrip').src = stripURL;
  $('dim').hidden = false;
  $('result').hidden = false;
  $('close').hidden = false;
  $('download').focus();
}

function reset() {
  $('result').hidden = true; $('close').hidden = true; $('dim').hidden = true;
  $('sceneOut').hidden = true; $('sceneBooth').hidden = false;
  $('slotStrip').classList.remove('out');
  $('start').disabled = false;
}

$('start').addEventListener('click', () => { audioOn(); session(); });
$('repeat').addEventListener('click', () => { audioOn(); reset(); session(); });
$('close').addEventListener('click', () => { reset(); $('start').focus(); });
$('download').addEventListener('click', async () => {
  const name = 'berlin-photobooth.png';
  // Phones: the system share sheet ("Save image", messengers). Mobile browsers don't save big data: links.
  if (stripBlob && matchMedia('(pointer: coarse)').matches && navigator.canShare) {
    const file = new File([stripBlob], name, { type: 'image/png' });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
  }
  // Desktop (and fallback): download via a blob URL
  const url = stripBlob ? URL.createObjectURL(stripBlob) : stripURL;
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  if (stripBlob) setTimeout(() => URL.revokeObjectURL(url), 10000);
});
</script>
