<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berlin Vintage Photobooth</title>
<meta name="description" content="A digital photobooth inspired by Berlin's vintage Photoautomat. Four black-and-white shots, one strip.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Berlin Vintage Photobooth">
<meta property="og:description" content="A digital photobooth inspired by Berlin's vintage Photoautomat. Four black-and-white shots, one strip.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aleksandra-novikova.github.io/berlin-photobooth/">
<meta property="og:image" content="https://aleksandra-novikova.github.io/berlin-photobooth/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=Open+Sans:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --s: 1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  body { font-family: "Manrope", sans-serif; letter-spacing: -0.05em; color: #000; }

  .title { left: 0; top: 200px; width: 1440px; margin: 0; text-align: center; font-size: 36px; font-weight: 400; line-height: 1; }
  .floor { position: fixed; z-index: 1; left: 0; right: 0; bottom: 0; height: calc(125px * var(--s)); background: #d9d9d9;
    display: flex; align-items: center; justify-content: center; padding: 0 16px; }
  .privacy { margin: 0; text-align: center; color: #555; font-size: max(12px, calc(18px * var(--s))); }

  /* 1440×1024 Figma frame, scaled to the viewport, anchored bottom-centre */
  .stage {
    position: fixed; left: 50%; bottom: 0; width: 1440px; height: 1024px;
    transform-origin: 50% 100%; transform: translateX(-50%) scale(var(--s));
    pointer-events: none;
  }
  .stage > * { pointer-events: auto; }
  .stage.base { z-index: 2; }
  .stage.top { z-index: 4; }
  .abs { position: absolute; }
  [hidden] { display: none !important; }

  .btn {
    position: absolute; display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 8px; background: #ffdddd; color: #000; cursor: pointer;
    font: 500 28px/1 "Manrope", sans-serif; letter-spacing: -0.05em;
    box-shadow: 0 4px 6px rgba(60, 10, 10, 0.3);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 3px rgba(60, 10, 10, 0.3); }
  .btn:focus-visible { outline: 3px solid #000; outline-offset: 3px; }
  .start { left: 514px; top: 759px; width: 151px; height: 44px; }
  .start .dot { width: 9px; height: 9px; border-radius: 50%; background: #d72a2a; }
  .start:hover .dot, .start:focus-visible .dot { background: #60c788; }
  .start:disabled { cursor: default; }

  /* Photoausgabe */
  .sign {
    left: 619px; top: 373px; width: 202px; height: 101px; background: #ffdddd;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .sign b { font-weight: 500; font-size: 24px; line-height: 1; }
  .sign span { font-weight: 500; font-size: 18px; line-height: 1; }
  .screw { width: 9px; height: 9px; border-radius: 50%; background: #9f9c97; top: 416px; }
  .slot { left: 641px; top: 498px; width: 158px; height: 294px; background: #692033; overflow: hidden; }
  .slot img { position: absolute; left: 32px; width: 93px; top: -480px; }
  .slot img.out { top: -186px; transition: top 5s cubic-bezier(.3,.1,.4,1); }

  .count {
    left: 626px; top: 455px; width: 200px; text-align: center;
    color: #fff; font-size: 90px; font-weight: 500; line-height: 1;
  }
  .msg { left: 470px; top: 480px; width: 500px; text-align: center; color: #fff; font-size: 28px; font-weight: 500; }
  .result-strip { left: 635px; top: 91px; width: 170px; }
  .dl { left: 867px; top: 470px; width: 148px; height: 46px; }
  .again { left: 867px; top: 540px; width: 148px; height: 46px; }

  .dim { position: fixed; inset: 0; z-index: 3; background: rgba(78, 78, 78, 0.9); }
  .flash { position: fixed; inset: 0; z-index: 5; background: #fff; opacity: 0; pointer-events: none; transition: opacity .5s ease-out; }
  .flash.on { opacity: .875; transition: none; }
  video { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="floor"><p class="privacy">Your photos are never uploaded or saved. Everything stays on your device.</p></div>

<div class="stage base">
  <h1 class="abs title">Berlin Vintage Photobooth</h1>

            font-family="'Open Sans', sans-serif" font-weight="800" font-size="66" fill="#af3c37">Photoautomat</text>
      <rect x="483.5" y="359.5" width="468.5" height="537" fill="#af3c37"/>

      <rect x="555" y="633.5" width="64" height="101.5" fill="#9f9c97"/>
      <rect x="563" y="646" width="48" height="76" fill="#692033"/>
      <!-- door -->
      <rect x="691" y="370.5" width="181.5" height="526" fill="#9f9c97"/>
      <g clip-path="url(#door)">
        <rect x="699.5" y="378.5" width="164.5" height="518" fill="#692033"/>
        <g clip-path="url(#curtain)">
          <rect x="699.5" y="378.5" width="164.5" height="230" fill="#808285"/>
          <polygon points="711.6,378.5 731.6,378.5 757.2,608 741.6,608" fill="#58595b"/>
          <polygon points="767,378.5 789,378.5 821.8,608 795.5,608" fill="#58595b"/>
          <polygon points="822.5,378.5 842,378.5 866,608 847.8,608" fill="#58595b"/>
        </g>
        <rect x="699.5" y="803.5" width="164.5" height="5" fill="#58595b"/>
        <rect x="699.5" y="808.5" width="164.5" height="88" fill="url(#chk)"/>
        <ellipse cx="848" cy="871" rx="22" ry="6" fill="#6d6e71"/>
        <rect x="839" y="776" width="19" height="94" fill="#6d6e71"/>
        <ellipse cx="845" cy="770" rx="38" ry="14" fill="#f28838"/>
        <ellipse cx="845" cy="765.5" rx="38" ry="14" fill="#fbb040"/>
      </g>
    </svg>
    <button class="btn start" id="start" type="button"><span class="dot" aria-hidden="true"></span>start</button>
  </div>

  <!-- Photoausgabe -->
  <div id="sceneOut" hidden>
    <div class="abs" style="left:477px;top:284px;width:486px;height:615px;background:#af3c37"></div>
    <div class="abs sign"><b>Photoausgabe</b><span>Hier in 5 Sekunden</span></div>
    <div class="abs screw" style="left:622.5px"></div>
    <div class="abs screw" style="left:807.5px"></div>
    <div class="abs" style="left:619px;top:474px;width:202px;height:344px;background:#9f9c97"></div>
    <div class="abs slot"><img id="slotStrip" alt=""></div>
  </div>
</div>

<div class="dim" id="dim" hidden></div>

<div class="stage top">
  <div class="abs count" id="count" aria-live="assertive"></div>
  <p class="abs msg" id="msg" hidden></p>
  <div id="result" hidden>
    <img class="abs result-strip" id="resultStrip" alt="Dein Fotostreifen mit vier Bildern">
    <button class="btn dl" id="download" type="button">download</button>
    <button class="btn again" id="repeat" type="button">repeat</button>
  </div>
</div>

<div class="flash" id="flash"></div>
<video id="video" playsinline muted></video>

<script>
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));

// Scale the 1440×1024 frame: fit height, keep booth + buttons on narrow screens
function fit() {
  const s = Math.min(innerHeight / 1024, innerWidth / 640);
  document.documentElement.style.setProperty('--s', s);
}
addEventListener('resize', fit); fit();

// Strip geometry (from the Figma strip, at 2×)
const CELL_W = 656, CELL_H = 860, SIDE = 12, TOP = 16, GAP = 12;
const STRIP_W = CELL_W + SIDE * 2, STRIP_H = TOP * 2 + CELL_H * 4 + GAP * 3;

function retro(video) {
  const c = document.createElement('canvas'); c.width = CELL_W; c.height = CELL_H;
  const ctx = c.getContext('2d');
  const vw = video.videoWidth, vh = video.videoHeight, r = CELL_W / CELL_H;
  let sw = vw, sh = vw / r; if (sh > vh) { sh = vh; sw = vh * r; }
  ctx.save(); ctx.translate(CELL_W, 0); ctx.scale(-1, 1);           // mirror like a selfie
  ctx.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, CELL_W, CELL_H);
  ctx.restore();

  // B&W, contrasty S-curve, grain, warm paper tone
  const img = ctx.getImageData(0, 0, CELL_W, CELL_H), d = img.data;
  const lo = [20, 16, 14], hi = [240, 231, 212];
  const exposure = rand(-0.07, 0.07), curve = rand(0.45, 0.75);   // every frame is exposed a little differently
  for (let i = 0; i < d.length; i += 4) {
    let L = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255;
    L = L + curve * (L * L * (3 - 2 * L) - L) + exposure;
    L += (Math.random() - 0.5) * 0.09;
    L = L < 0 ? 0 : L > 1 ? 1 : L;
    d[i] = lo[0] + (hi[0] - lo[0]) * L; d[i + 1] = lo[1] + (hi[1] - lo[1]) * L; d[i + 2] = lo[2] + (hi[2] - lo[2]) * L;
  }
  ctx.putImageData(img, 0, 0);

  // Your textures: paper grain + dust & scratches, random crop per frame
  const tex = (el, mode, alpha) => {
    const s = Math.max(CELL_W / el.naturalWidth, CELL_H / el.naturalHeight) * (1.2 + Math.random() * 0.4);
    const w = el.naturalWidth * s, h = el.naturalHeight * s;
    ctx.globalCompositeOperation = mode; ctx.globalAlpha = alpha;
    ctx.drawImage(el, -Math.random() * (w - CELL_W), -Math.random() * (h - CELL_H), w, h);
  };
  tex($('texLight'), 'multiply', 0.45);
  tex($('texDark'), 'screen', 0.35);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  // Vignette
  const g = ctx.createRadialGradient(CELL_W / 2, CELL_H / 2, CELL_H * 0.3, CELL_W / 2, CELL_H / 2, CELL_H * 0.75);
  g.addColorStop(0, 'rgba(20,14,10,0)'); g.addColorStop(1, 'rgba(20,14,10,0.45)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CELL_W, CELL_H);

  // Chemistry flaws, different every time
  const a = rand(0, Math.PI * 2), r0 = CELL_H / 2;              // uneven development: one side a bit darker

  noiseBurst(t + 0.09, 1600, 'bandpass', 0.25, 0.04);
}

  $('msg').hidden = true;
  const video = $('video');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
  } catch (e) {
    $('dim').hidden = false;
    $('msg').textContent = 'Kein Kamerazugriff. Bitte erlaube die Kamera und versuch es noch einmal.';
    $('msg').hidden = false;
    await wait(3500);
    $('msg').hidden = true; $('dim').hidden = true; $('start').disabled = false;
    return;
  }
  video.srcObject = stream; await video.play();

  $('dim').hidden = false;
  const frames = [];
  for (let shot = 0; shot < 4; shot++) {
    for (const n of [3, 2, 1]) { $('count').textContent = n; await wait(1000); }
    $('count').textContent = '';
    frames.push(retro(video));
    shutterSound();
    $('flash').classList.add('on');
    await wait(80);
    $('flash').classList.remove('on');
    await wait(900);
  }
  stream.getTracks().forEach(t => t.stop());
  stripURL = buildStrip(frames);

  // Photoausgabe: the strip slides out of the slot
  $('dim').hidden = true;
  $('sceneBooth').hidden = true;
  $('sceneOut').hidden = false;
  const slot = $('slotStrip');
  slot.classList.remove('out'); slot.src = stripURL;
  await wait(400);
  slot.classList.add('out');
  printerSound();
  await wait(5600);

  $('resultStrip').src = stripURL;
  $('dim').hidden = false;
  $('result').hidden = false;
  $('download').focus();
}

function reset() {
  $('result').hidden = true; $('dim').hidden = true;
  $('sceneOut').hidden = true; $('sceneBooth').hidden = false;
  $('slotStrip').classList.remove('out');
  $('start').disabled = false;
}

$('start').addEventListener('click', () => { audioOn(); session(); });
$('repeat').addEventListener('click', () => { audioOn(); reset(); session(); });
$('download').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = stripURL; a.download = 'berlin-photobooth.png'; a.click();
});
</script>
</body>
</html>
